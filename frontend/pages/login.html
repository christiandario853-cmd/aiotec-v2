<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – AioTec</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar">
    <a href="/" class="nav-brand">
      <img src="/assets/logo.jpg" alt="AioTec">
    </a>
    <ul class="nav-links">
      <li><a href="/">Inicio</a></li>
      <li><a href="/pages/productos.html">Productos</a></li>
      <li><a href="/pages/nosotros.html">Nosotros</a></li>
      <li><a href="/pages/contacto.html">Contacto</a></li>
      <li><a href="/pages/login.html" class="active">Login</a></li>
      <li><a href="/pages/registro.html">Registro</a></li>
    </ul>
    <button class="hamburger" onclick="toggleMenu()">☰</button>
  </nav>

  <main class="auth-page">
    <div class="auth-card">
      <img src="/assets/logo.jpg" alt="AioTec" class="auth-logo">
      <h2>Bienvenido de <span>vuelta</span></h2>
      <p class="subtitle">Ingresa tus credenciales para acceder a tu cuenta</p>

      <div class="alert success" id="alertSuccess">✅ Sesión iniciada. Redirigiendo...</div>
      <div class="alert error"   id="alertError">❌ Credenciales incorrectas.</div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="tu@correo.com" autocomplete="email">
        <span class="field-error" id="errEmail">Ingresa un correo válido</span>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        <span class="field-error" id="errPass">Ingresa tu contraseña</span>
      </div>

      <button class="btn-primary full-width" onclick="handleLogin()">Iniciar sesión</button>

      <p class="auth-link">¿No tienes cuenta? <a href="/pages/registro.html">Regístrate gratis</a></p>
    </div>
  </main>

  <script src="/js/main.js"></script>
  <script>
    async function handleLogin() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const alertOk  = document.getElementById('alertSuccess');
      const alertErr = document.getElementById('alertError');
      const errEmail = document.getElementById('errEmail');
      const errPass  = document.getElementById('errPass');

      alertOk.classList.remove('show');
      alertErr.classList.remove('show');
      errEmail.classList.remove('show');
      errPass.classList.remove('show');
      document.getElementById('email').classList.remove('input-error');
      document.getElementById('password').classList.remove('input-error');

      let valido = true;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        document.getElementById('email').classList.add('input-error');
        errEmail.classList.add('show');
        valido = false;
      }
      if (!password) {
        document.getElementById('password').classList.add('input-error');
        errPass.classList.add('show');
        valido = false;
      }
      if (!valido) return;

      try {
        const res  = await fetch('http://localhost:3000/api/auth/login', {
          method : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body   : JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('aiotec_user', JSON.stringify(data.usuario));
          alertOk.classList.add('show');
          setTimeout(() => window.location.href = '../index.html', 1300);
        } else {
          alertErr.textContent = '❌ ' + (data.error || 'Credenciales incorrectas.');
          alertErr.classList.add('show');
        }
      } catch {
        // Modo demo sin backend
        const demoUser = { id: 1, nombre: email.split('@')[0], email };
        localStorage.setItem('aiotec_user', JSON.stringify(demoUser));
        alertOk.textContent = '✅ Modo demo – Sesión iniciada. Redirigiendo...';
        alertOk.classList.add('show');
        setTimeout(() => window.location.href = '../index.html', 1300);
      }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
  </script>
</body>
</html>
