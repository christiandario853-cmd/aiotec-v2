<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard – AioTec Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* ── Dashboard específico ── */
    .dashboard-page { padding: 7rem 3rem 4rem; max-width: 1300px; margin: 0 auto; }

    .dash-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:2.5rem; flex-wrap:wrap; gap:1rem; }
    .dash-header h1 { font-size:1.8rem; font-weight:900; }
    .dash-header h1 span { color:var(--accent); }
    .dash-live { display:flex; align-items:center; gap:0.5rem; font-size:0.8rem; color:var(--text-secondary); }
    .live-dot { width:8px;height:8px;background:var(--success);border-radius:50%;animation:blink 1.5s infinite; }

    /* ── KPI Cards ── */
    .kpi-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:1.25rem; margin-bottom:2.5rem; }

    .kpi-card {
      background:var(--bg-card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:1.5rem;
      transition:var(--transition);
      position:relative;
      overflow:hidden;
    }
    .kpi-card::before {
      content:'';
      position:absolute; top:0;left:0;right:0;
      height:3px;
      background:var(--accent);
    }
    .kpi-card.blue::before  { background:#6c63ff; }
    .kpi-card.green::before { background:var(--success); }
    .kpi-card.pink::before  { background:#ec4899; }
    .kpi-card.orange::before{ background:var(--accent); }

    .kpi-card:hover { transform:translateY(-4px); border-color:rgba(232,160,32,0.3); }

    .kpi-icon { font-size:2rem; margin-bottom:0.75rem; }
    .kpi-label { font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:1.5px; color:var(--text-secondary); margin-bottom:0.4rem; }
    .kpi-value { font-size:2rem; font-weight:900; line-height:1; }
    .kpi-value.money::before { content:'$'; font-size:1.1rem; vertical-align:top; margin-top:0.3rem; display:inline-block; }
    .kpi-sub { font-size:0.75rem; color:var(--text-secondary); margin-top:0.4rem; }

    /* ── Sección periodos ── */
    .section-title-sm { font-size:1.1rem; font-weight:800; margin-bottom:1.25rem; }
    .section-title-sm span { color:var(--accent); }

    .periodos-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1.25rem; margin-bottom:2.5rem; }

    .periodo-card {
      background:var(--bg-card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:1.5rem;
      text-align:center;
      transition:var(--transition);
    }
    .periodo-card:hover { border-color:rgba(232,160,32,0.3); transform:translateY(-3px); }
    .periodo-label { font-size:0.78rem; font-weight:700; text-transform:uppercase; letter-spacing:1.5px; color:var(--text-secondary); margin-bottom:0.6rem; }
    .periodo-value { font-size:1.8rem; font-weight:900; color:var(--accent); }
    .periodo-icon { font-size:1.5rem; margin-bottom:0.5rem; }

    /* ── Dos columnas abajo ── */
    .dash-bottom { display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; margin-bottom:2.5rem; }

    .dash-card {
      background:var(--bg-card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:1.75rem;
    }
    .dash-card h3 { font-size:1rem; font-weight:800; margin-bottom:1.5rem; }
    .dash-card h3 span { color:var(--accent); }

    /* ── Producto top ── */
    .top-producto {
      display:flex;
      align-items:center;
      gap:1.5rem;
      padding:1.5rem;
      background:var(--bg-secondary);
      border-radius:12px;
      border:1px solid var(--border);
    }
    .top-emoji { font-size:4rem; }
    .top-info h4 { font-size:1.1rem; font-weight:800; margin-bottom:0.4rem; }
    .top-badge {
      display:inline-block;
      background:var(--accent-dim);
      border:1px solid rgba(232,160,32,0.3);
      color:var(--accent);
      font-size:0.72rem;
      font-weight:700;
      padding:0.25rem 0.75rem;
      border-radius:20px;
      letter-spacing:1px;
    }
    .top-units { font-size:0.82rem; color:var(--text-secondary); margin-top:0.4rem; }

    /* ── Barras de ventas diarias ── */
    .bar-chart { display:flex; align-items:flex-end; gap:0.6rem; height:120px; }
    .bar-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:0.4rem; height:100%; }
    .bar {
      width:100%;
      background:var(--accent);
      border-radius:6px 6px 0 0;
      min-height:4px;
      transition:height 0.6s ease;
      position:relative;
    }
    .bar:hover::after {
      content:attr(data-value);
      position:absolute;
      top:-28px; left:50%;
      transform:translateX(-50%);
      background:var(--bg-card);
      border:1px solid var(--border);
      padding:0.2rem 0.5rem;
      border-radius:4px;
      font-size:0.7rem;
      white-space:nowrap;
      color:var(--text-primary);
    }
    .bar-label { font-size:0.65rem; color:var(--text-secondary); text-align:center; }

    /* ── Tabla últimas compras ── */
    .compras-table { width:100%; border-collapse:collapse; }
    .compras-table th {
      font-size:0.7rem;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:1px;
      color:var(--text-secondary);
      padding:0.5rem 0.75rem;
      text-align:left;
      border-bottom:1px solid var(--border);
    }
    .compras-table td {
      font-size:0.82rem;
      padding:0.75rem;
      border-bottom:1px solid var(--border);
      color:var(--text-secondary);
    }
    .compras-table td:first-child { font-weight:700; color:var(--text-primary); }
    .compras-table td .total-cell { color:var(--accent); font-weight:700; }
    .compras-table tr:last-child td { border-bottom:none; }
    .compras-table tr:hover td { background:var(--bg-secondary); }

    /* ── Loading skeleton ── */
    .skeleton {
      background:linear-gradient(90deg, var(--bg-secondary) 25%, var(--bg-card-hover) 50%, var(--bg-secondary) 75%);
      background-size:200% 100%;
      animation:shimmer 1.5s infinite;
      border-radius:8px;
    }
    @keyframes shimmer { to { background-position:-200% 0; } }

    .no-data { color:var(--text-secondary); font-size:0.9rem; text-align:center; padding:2rem; }

    /* ── Responsive ── */
    @media (max-width:768px) {
      .dashboard-page { padding:6rem 1.5rem 3rem; }
      .periodos-grid { grid-template-columns:1fr; }
      .dash-bottom { grid-template-columns:1fr; }
      .bar-chart { height:80px; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <img src="/assets/logo.jpg" alt="AioTec">
    </a>
    <ul class="nav-links">
      <li><a href="/">Inicio</a></li>
      <li><a href="/pages/productos.html">Productos</a></li>
      <li><a href="/pages/nosotros.html">Nosotros</a></li>
      <li><a href="/pages/contacto.html">Contacto</a></li>
      <li><a href="/pages/dashboard.html" class="active">Panel</a></li>
    </ul>
    <button class="hamburger" onclick="toggleMenu()">☰</button>
  </nav>

  <main class="dashboard-page">

    <div class="dash-header">
      <div>
        <div class="section-label">Panel Administrativo</div>
        <h1>Dashboard de <span>Estadísticas</span></h1>
      </div>
      <div class="dash-live">
        <span class="live-dot"></span>
        Datos en tiempo real · <span id="lastUpdate">Cargando...</span>
        <button onclick="cargarEstadisticas()" style="background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);padding:0.35rem 0.75rem;border-radius:6px;font-size:0.78rem;margin-left:0.5rem;cursor:pointer;">↻ Actualizar</button>
      </div>
    </div>

    <!-- KPI CARDS -->
    <div class="kpi-grid" id="kpiGrid">
      <div class="kpi-card"><div class="skeleton" style="height:100px"></div></div>
      <div class="kpi-card"><div class="skeleton" style="height:100px"></div></div>
      <div class="kpi-card"><div class="skeleton" style="height:100px"></div></div>
      <div class="kpi-card"><div class="skeleton" style="height:100px"></div></div>
      <div class="kpi-card"><div class="skeleton" style="height:100px"></div></div>
    </div>

    <!-- INGRESOS POR PERÍODO -->
    <h2 class="section-title-sm">Ingresos por <span>período</span></h2>
    <div class="periodos-grid" id="periodosGrid">
      <div class="periodo-card"><div class="skeleton" style="height:80px"></div></div>
      <div class="periodo-card"><div class="skeleton" style="height:80px"></div></div>
      <div class="periodo-card"><div class="skeleton" style="height:80px"></div></div>
    </div>

    <!-- GRÁFICO + TOP PRODUCTO -->
    <div class="dash-bottom">
      <div class="dash-card">
        <h3>Ventas últimos <span>7 días</span></h3>
        <div class="bar-chart" id="barChart">
          <div class="no-data">Cargando gráfico...</div>
        </div>
      </div>
      <div class="dash-card">
        <h3>Producto más <span>vendido</span></h3>
        <div id="topProductoCard">
          <div class="skeleton" style="height:100px;border-radius:12px"></div>
        </div>
      </div>
    </div>

    <!-- ÚLTIMAS COMPRAS -->
    <div class="dash-card" style="margin-bottom:2rem">
      <h3>Últimas <span>compras registradas</span></h3>
      <div id="ultimasCompras">
        <div class="skeleton" style="height:150px;border-radius:8px"></div>
      </div>
    </div>

  </main>

  <footer class="footer">
    <div class="footer-bottom" style="border-top:none;padding-top:0">
      <p>© 2025 AioTec · Panel Administrativo</p>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script>
    async function cargarEstadisticas() {
      try {
        const res  = await fetch('http://localhost:3000/api/estadisticas');
        const data = res.ok ? await res.json() : null;

        if (data) {
          renderKPIs(data.resumen);
          renderPeriodos(data.periodos);
          renderBarChart(data.ventas_diarias);
          renderTopProducto(data.top_producto);
          await cargarUltimasCompras();
        } else {
          renderDemoData();
        }
      } catch {
        renderDemoData();
      }

      document.getElementById('lastUpdate').textContent =
        new Date().toLocaleTimeString('es-EC', { hour:'2-digit', minute:'2-digit' });
    }

    function renderKPIs(r) {
      document.getElementById('kpiGrid').innerHTML = `
        <div class="kpi-card orange">
          <div class="kpi-icon">💰</div>
          <div class="kpi-label">Ingresos totales</div>
          <div class="kpi-value money">${r.total_ingresos.toFixed(2)}</div>
          <div class="kpi-sub">Incluye IVA</div>
        </div>
        <div class="kpi-card blue">
          <div class="kpi-icon">🛒</div>
          <div class="kpi-label">Total compras</div>
          <div class="kpi-value">${r.total_compras}</div>
          <div class="kpi-sub">Órdenes completadas</div>
        </div>
        <div class="kpi-card green">
          <div class="kpi-icon">📦</div>
          <div class="kpi-label">Unidades vendidas</div>
          <div class="kpi-value">${r.unidades_vendidas}</div>
          <div class="kpi-sub">Productos despachados</div>
        </div>
        <div class="kpi-card pink">
          <div class="kpi-icon">👥</div>
          <div class="kpi-label">Usuarios registrados</div>
          <div class="kpi-value">${r.total_usuarios}</div>
          <div class="kpi-sub">Cuentas activas</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon">🏷️</div>
          <div class="kpi-label">IVA recaudado</div>
          <div class="kpi-value money">${r.total_iva.toFixed(2)}</div>
          <div class="kpi-sub">15% sobre subtotal</div>
        </div>
      `;
    }

    function renderPeriodos(p) {
      document.getElementById('periodosGrid').innerHTML = `
        <div class="periodo-card">
          <div class="periodo-icon">☀️</div>
          <div class="periodo-label">Hoy</div>
          <div class="periodo-value">$${p.ingresos_hoy.toFixed(2)}</div>
        </div>
        <div class="periodo-card">
          <div class="periodo-icon">📅</div>
          <div class="periodo-label">Esta semana</div>
          <div class="periodo-value">$${p.ingresos_semana.toFixed(2)}</div>
        </div>
        <div class="periodo-card">
          <div class="periodo-icon">📆</div>
          <div class="periodo-label">Este mes</div>
          <div class="periodo-value">$${p.ingresos_mes.toFixed(2)}</div>
        </div>
      `;
    }

    function renderBarChart(ventas) {
      const container = document.getElementById('barChart');
      if (!ventas?.length) {
        container.innerHTML = '<p class="no-data">Sin ventas registradas aún</p>';
        return;
      }
      const max = Math.max(...ventas.map(v => v.total), 1);
      container.innerHTML = ventas.map(v => {
        const pct = Math.max((v.total / max) * 100, 4);
        return `
          <div class="bar-col">
            <div class="bar" style="height:${pct}%" data-value="$${parseFloat(v.total).toFixed(2)}"></div>
            <span class="bar-label">${v.dia}</span>
          </div>`;
      }).join('');
    }

    function renderTopProducto(p) {
      const el = document.getElementById('topProductoCard');
      if (!p) {
        el.innerHTML = '<p class="no-data">Sin ventas registradas aún</p>';
        return;
      }
      el.innerHTML = `
        <div class="top-producto">
          <span class="top-emoji">${p.emoji || '📦'}</span>
          <div class="top-info">
            <h4>${p.nombre_producto}</h4>
            <span class="top-badge">🏆 MÁS VENDIDO</span>
            <p class="top-units">${p.total_vendido} unidades vendidas</p>
          </div>
        </div>`;
    }

    async function cargarUltimasCompras() {
      try {
        // Obtener últimas compras de todos los usuarios
        const res  = await fetch('http://localhost:3000/api/estadisticas');
        // Usamos las ventas diarias como referencia ya que no hay endpoint de todas las compras
        document.getElementById('ultimasCompras').innerHTML = `
          <p class="no-data" style="padding:1rem">
            Conecta al backend para ver el historial completo de compras.
          </p>`;
      } catch {
        document.getElementById('ultimasCompras').innerHTML = `
          <p class="no-data">Backend no disponible en modo demo</p>`;
      }
    }

    /* ── Datos de demo si no hay backend ── */
    function renderDemoData() {
      renderKPIs({ total_ingresos:4823.45, total_compras:12, unidades_vendidas:28, total_usuarios:8, total_iva:629.13 });
      renderPeriodos({ ingresos_hoy:345.99, ingresos_semana:1240.50, ingresos_mes:4823.45 });
      renderBarChart([
        {dia:'09/05',total:320},{dia:'10/05',total:580},{dia:'11/05',total:220},
        {dia:'12/05',total:890},{dia:'13/05',total:450},{dia:'14/05',total:680},{dia:'15/05',total:345}
      ]);
      renderTopProducto({ nombre_producto:'Laptop ProX 15', emoji:'💻', total_vendido:7 });
      document.getElementById('ultimasCompras').innerHTML = `
        <table class="compras-table">
          <thead><tr><th>#</th><th>Usuario</th><th>Productos</th><th>Subtotal</th><th>IVA</th><th>Total</th><th>Fecha</th></tr></thead>
          <tbody>
            <tr><td>#001</td><td>Carlos M.</td><td>Laptop ProX 15</td><td>$1299.99</td><td>$195.00</td><td class="total-cell">$1494.99</td><td>15/05/2025</td></tr>
            <tr><td>#002</td><td>Valeria R.</td><td>Smartphone Z9, Auriculares NC1</td><td>$1049.98</td><td>$157.50</td><td class="total-cell">$1207.48</td><td>14/05/2025</td></tr>
            <tr><td>#003</td><td>Diego P.</td><td>Smartwatch GT5</td><td>$349.99</td><td>$52.50</td><td class="total-cell">$402.49</td><td>13/05/2025</td></tr>
          </tbody>
        </table>`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      cargarEstadisticas();
      actualizarNavAuth();
      // Actualizar cada 60 segundos
      setInterval(cargarEstadisticas, 60000);
    });
  </script>
</body>
</html>
